services:
  postgres:
    image: postgres:16-alpine
    container_name: desafio-2026-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: especies
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d especies"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
